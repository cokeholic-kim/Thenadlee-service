# 공유호스팅(FTP 전용) 웹 배포
#   html/        <- root/.htaccess (도메인 루트 접속 시 html/front/ 의 React 앱 제공)
#   html/front/  <- React 빌드 결과물(build/)
#   html/file/   <- file/ (이미지·영상 정적 파일)
# PHP API(html/back/)는 별도 private 저장소에서 배포함
#
# production environment 의 Variables 에 DEPLOY_ENABLED=true 가 있어야 배포가 실행됨
# API 키(REACT_APP_GOOGLE_API_KEY, REACT_APP_WHEATHER_API_KEY, REACT_APP_KAKAO_JS_KEY)는 production environment 의 Secrets 에서 읽음
# REACT_APP_KAKAO_JS_KEY 가 없으면 국내 여행지도 Google 지도로 표시됨
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # PR 에서는 키 없이 빌드가 되는지만 확인
  build-check:
    name: React 빌드 확인 (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm run build
        run: npm run build
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'

  # main push / 수동 실행 시 production environment 의 Secrets 로 빌드 후 FTP 업로드
  deploy:
    name: 빌드 및 FTP 업로드
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR || 'html/' }}
    # DEPLOY_ENABLED 는 production environment 변수라 job if 에서는 읽히지 않아 step 마다 확인
    steps:
      - if: vars.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@v4

      - if: vars.DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - if: vars.DEPLOY_ENABLED == 'true'
        run: npm ci

      # 경로 값(REACT_APP_API_URL 등)은 .env.production, API 키는 Secrets 에서 주입
      - if: vars.DEPLOY_ENABLED == 'true'
        name: npm run build
        run: npm run build
        env:
          # 기존 코드의 경고가 CI 에서 에러로 처리되지 않도록 함
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
          REACT_APP_WHEATHER_API_KEY: ${{ secrets.REACT_APP_WHEATHER_API_KEY }}
          REACT_APP_KAKAO_JS_KEY: ${{ secrets.REACT_APP_KAKAO_JS_KEY }}
          # 검색 사이트 소유 확인 값 (네이버 서치어드바이저·구글 서치콘솔에서 발급, 없으면 생략)
          REACT_APP_NAVER_SITE_VERIFICATION: ${{ vars.REACT_APP_NAVER_SITE_VERIFICATION }}
          REACT_APP_GOOGLE_SITE_VERIFICATION: ${{ vars.REACT_APP_GOOGLE_SITE_VERIFICATION }}

      - if: vars.DEPLOY_ENABLED == 'true'
        name: 업로드 - html/ (도메인 루트 .htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./root/
          server-dir: ${{ env.FTP_BASE_DIR }}

      - if: vars.DEPLOY_ENABLED == 'true'
        name: 업로드 - html/front/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./build/
          server-dir: ${{ env.FTP_BASE_DIR }}front/

      - if: vars.DEPLOY_ENABLED == 'true'
        name: 업로드 - html/file/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./file/
          server-dir: ${{ env.FTP_BASE_DIR }}file/
          # 서버에서 올린 이미지(html/file/uploads, 비공개 html/file/private)는 배포가 건드리지 않도록 제외
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**
            private/**
